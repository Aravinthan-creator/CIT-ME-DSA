<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ex 1: Skip List vs AVL Tree</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5d6672;--bd:#dfe3e8;--sl:#2a78d6;--avl:#e8743b;--ac:#1f5fb4}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mut:#9aa4b0;--bd:#323943;--sl:#5aa2f0;--avl:#f29463;--ac:#5aa2f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding:20px}
.w{max-width:980px;margin:auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button{margin-top:14px;padding:9px 20px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-left:12px;color:var(--mut);font-size:13px}#msg.err{color:#d33}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tr.sep td{border-bottom:2px solid var(--bd)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px;overflow-x:auto;margin:0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--tx);font:11px system-ui,sans-serif}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#res{display:none}
</style>
</head>
<body>
<div class="w">
<h1>Ex 1: Skip List vs AVL Tree</h1>
<p class="sub">Ordered in-memory index (order-book style). Enter the workload parameters, run the benchmark, and view the output table, range query and graphs.</p>

<div class="card">
<h2>Inputs</h2>
<div class="grid">
<div><label>n values (comma separated)</label><input id="ns" value="10000, 50000, 100000"></div>
<div><label>Skip list probability p</label><input id="p" type="number" step="0.05" min="0.05" max="0.95" value="0.5"></div>
<div><label>Skip list MaxLevel</label><input id="ml" type="number" min="1" max="32" value="20"></div>
<div><label>Random seed</label><input id="seed" type="number" value="42"></div>
<div><label>Range query: demo keys (from 1..1000)</label><input id="dk" type="number" min="1" max="999" value="200"></div>
<div><label>Range query lo</label><input id="lo" type="number" value="100"></div>
<div><label>Range query hi</label><input id="hi" type="number" value="160"></div>
</div>
<button id="run">Run benchmark</button><span id="msg"></span>
</div>

<div id="res">
<div class="card">
<h2>Output</h2>
<div class="sc"><table id="tb"></table></div>
<pre id="extra" style="margin-top:12px"></pre>
</div>
<div class="card">
<h2>Graphical analysis</h2>
<div class="charts">
<div><svg id="c1" viewBox="0 0 460 290"></svg><div class="lg" id="l1"></div></div>
<div><svg id="c2" viewBox="0 0 460 290"></svg><div class="lg" id="l2"></div></div>
</div>
</div>
<div class="card"><h2>Analysis</h2><div id="an"></div></div>
</div>
</div>

<script>
/* ---------- seeded RNG ---------- */
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Skip List ---------- */
class SLNode{constructor(k,v,l){this.key=k;this.val=v;this.fwd=new Array(l+1).fill(null)}}
class SkipList{
  constructor(rnd,max=20,p=0.5){this.rnd=rnd;this.MAX=max;this.p=p;this.level=0;this.head=new SLNode(null,null,max);this.size=0;this.cmp=0}
  randLevel(){let l=0;while(this.rnd()<this.p&&l<this.MAX)l++;return l}
  findUpdate(key){
    const upd=new Array(this.MAX+1).fill(null);let x=this.head;
    for(let i=this.level;i>=0;i--){
      while(x.fwd[i]!==null&&x.fwd[i].key<key){this.cmp++;x=x.fwd[i]}
      this.cmp++;upd[i]=x;
    }
    return [upd,x.fwd[0]];
  }
  insert(key,val){
    const [upd,x]=this.findUpdate(key);
    if(x!==null&&x.key===key){x.val=val;return}
    const lvl=this.randLevel();
    if(lvl>this.level){for(let i=this.level+1;i<=lvl;i++)upd[i]=this.head;this.level=lvl}
    const n=new SLNode(key,val,lvl);
    for(let i=0;i<=lvl;i++){n.fwd[i]=upd[i].fwd[i];upd[i].fwd[i]=n}
    this.size++;
  }
  search(key){
    let x=this.head;
    for(let i=this.level;i>=0;i--){
      while(x.fwd[i]!==null&&x.fwd[i].key<key){this.cmp++;x=x.fwd[i]}
      this.cmp++;
    }
    x=x.fwd[0];return x!==null&&x.key===key?x.val:null;
  }
  delete(key){
    const [upd,x]=this.findUpdate(key);
    if(x===null||x.key!==key)return false;
    for(let i=0;i<=this.level;i++){if(upd[i].fwd[i]!==x)break;upd[i].fwd[i]=x.fwd[i]}
    while(this.level>0&&this.head.fwd[this.level]===null)this.level--;
    this.size--;return true;
  }
  rangeQuery(lo,hi){
    let x=this.head;
    for(let i=this.level;i>=0;i--)while(x.fwd[i]!==null&&x.fwd[i].key<lo)x=x.fwd[i];
    x=x.fwd[0];const out=[];
    while(x!==null&&x.key<=hi){out.push(x.key);x=x.fwd[0]}
    return out;
  }
}

/* ---------- AVL Tree ---------- */
class AVLNode{constructor(k,v){this.key=k;this.val=v;this.left=null;this.right=null;this.h=1}}
const H=n=>n?n.h:0, updH=n=>{n.h=1+Math.max(H(n.left),H(n.right))}, bal=n=>H(n.left)-H(n.right);
function rotR(z){const y=z.left;z.left=y.right;y.right=z;updH(z);updH(y);return y}
function rotL(z){const y=z.right;z.right=y.left;y.left=z;updH(z);updH(y);return y}
function rebalance(n){
  updH(n);const b=bal(n);
  if(b>1){if(bal(n.left)<0)n.left=rotL(n.left);return rotR(n)}
  if(b<-1){if(bal(n.right)>0)n.right=rotR(n.right);return rotL(n)}
  return n;
}
class AVL{
  constructor(){this.root=null;this.cmp=0}
  insert(k,v){this.root=this._ins(this.root,k,v)}
  _ins(n,k,v){
    if(n===null)return new AVLNode(k,v);
    this.cmp++;
    if(k<n.key)n.left=this._ins(n.left,k,v);
    else if(k>n.key)n.right=this._ins(n.right,k,v);
    else{n.val=v;return n}
    return rebalance(n);
  }
  search(k){
    let n=this.root;
    while(n){this.cmp++;if(k===n.key)return n.val;n=k<n.key?n.left:n.right}
    return null;
  }
  delete(k){this.root=this._del(this.root,k)}
  _del(n,k){
    if(n===null)return null;
    this.cmp++;
    if(k<n.key)n.left=this._del(n.left,k);
    else if(k>n.key)n.right=this._del(n.right,k);
    else{
      if(!n.left||!n.right)return n.left||n.right;
      let s=n.right;while(s.left)s=s.left;
      n.key=s.key;n.val=s.val;n.right=this._del(n.right,s.key);
    }
    return rebalance(n);
  }
}

/* ---------- benchmark ---------- */
function timeit(fn,keys){const t=performance.now();for(let i=0;i<keys.length;i++)fn(keys[i]);return performance.now()-t}
function sampleKeys(N,hi,rnd){const s=new Set();while(s.size<N)s.add(1+Math.floor(rnd()*(hi-1)));return [...s]}
function pick(arr,m,rnd){const a=arr.slice();for(let i=0;i<m;i++){const j=i+Math.floor(rnd()*(a.length-i));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,m)}
function benchmark(N,rnd,p,ml){
  const keys=sampleKeys(N,10*N,rnd),probe=pick(keys,N>>1,rnd),sl=new SkipList(rnd,ml,p),avl=new AVL(),rows=[];
  for(const [op,sf,af,data] of [
    ["insert",k=>sl.insert(k,k),k=>avl.insert(k,k),keys],
    ["search",k=>sl.search(k),k=>avl.search(k),probe],
    ["delete",k=>sl.delete(k),k=>avl.delete(k),probe]]){
    sl.cmp=avl.cmp=0;
    const ts=timeit(sf,data),ta=timeit(af,data);
    rows.push({N,op,ts,ta,sc:sl.cmp/data.length,ac:avl.cmp/data.length});
  }
  return rows;
}
/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const SLC="var(--sl)",AVC="var(--avl)";
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e}
function axes(W,Hh,m,ymax,ylab,ticks=5){
  let s="";
  for(let i=0;i<=ticks;i++){
    const y=m.t+(Hh-m.t-m.b)*(1-i/ticks),v=ymax*i/ticks;
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${+v.toFixed(1)}</text>`;
  }
  return s+`<text x="12" y="${m.t+(Hh-m.t-m.b)/2}" transform="rotate(-90 12 ${m.t+(Hh-m.t-m.b)/2})" text-anchor="middle">${ylab}</text>`;
}
function barChart(rows,N){
  const W=460,Hh=290,m={l:50,r:10,t:26,b:30},ops=rows.map(r=>r.op);
  const ymax=niceMax(Math.max(...rows.flatMap(r=>[r.ts,r.ta]))),ph=Hh-m.t-m.b,gw=(W-m.l-m.r)/ops.length;
  let s=`<text x="${W/2}" y="14" text-anchor="middle" font-weight="600">Operation time at n = ${N.toLocaleString()}</text>`+axes(W,Hh,m,ymax,"time (ms)");
  rows.forEach((r,i)=>{
    const x0=m.l+i*gw+gw*0.18,bw=gw*0.32;
    [[r.ts,SLC],[r.ta,AVC]].forEach(([v,c],j)=>{
      const h=ph*v/ymax,x=x0+j*bw,y=m.t+ph-h;
      s+=`<rect x="${x}" y="${y}" width="${bw-3}" height="${h}" fill="${c}" rx="2"/><text x="${x+(bw-3)/2}" y="${y-3}" text-anchor="middle">${v.toFixed(0)}</text>`;
    });
    s+=`<text x="${m.l+i*gw+gw/2}" y="${Hh-10}" text-anchor="middle">${r.op}</text>`;
  });
  $("c1").innerHTML=s;
  $("l1").innerHTML=`<span><i style="background:${SLC}"></i>Skip list</span><span><i style="background:${AVC}"></i>AVL tree</span>`;
}
function lineChart(data){
  const W=460,Hh=290,m={l:50,r:14,t:26,b:34},ph=Hh-m.t-m.b,pw=W-m.l-m.r;
  const Ns=data.map(d=>d.N),lx=Ns.map(Math.log10);
  let a=Math.min(...lx),b=Math.max(...lx);if(a===b){a-=0.3;b+=0.3}
  const X=n=>m.l+pw*(Math.log10(n)-a)/(b-a);
  const ymax=niceMax(Math.max(...data.flatMap(d=>[d.sc,d.ac,2*Math.log2(d.N)])));
  const Y=v=>m.t+ph*(1-v/ymax);
  let s=`<text x="${W/2}" y="14" text-anchor="middle" font-weight="600">Comparisons per search vs n</text>`+axes(W,Hh,m,ymax,"comparisons / search");
  const path=(f,c,dash)=>`<polyline fill="none" stroke="${c}" stroke-width="2" ${dash?'stroke-dasharray="5 4" opacity=".7"':""} points="${data.map(d=>X(d.N)+","+Y(f(d))).join(" ")}"/>`;
  s+=path(d=>Math.log2(d.N),AVC,1)+path(d=>2*Math.log2(d.N),SLC,1)+path(d=>d.sc,SLC)+path(d=>d.ac,AVC);
  data.forEach(d=>{
    s+=`<circle cx="${X(d.N)}" cy="${Y(d.sc)}" r="3.5" fill="${SLC}"/><circle cx="${X(d.N)}" cy="${Y(d.ac)}" r="3.5" fill="${AVC}"/><text x="${X(d.N)}" y="${Hh-18}" text-anchor="middle">${d.N>=1000?d.N/1000+"k":d.N}</text>`;
  });
  s+=`<text x="${W/2}" y="${Hh-4}" text-anchor="middle">n (log scale)</text>`;
  $("c2").innerHTML=s;
  $("l2").innerHTML=`<span><i style="background:${SLC}"></i>Skip list</span><span><i style="background:${AVC}"></i>AVL tree</span><span>dashed: 2·log₂ n (blue), log₂ n (orange)</span>`;
}
function setMsg(t,err){const m=$("msg");m.textContent=t;m.className=err?"err":""}

$("run").onclick=async()=>{
  const ns=$("ns").value.split(/[,\s]+/).filter(Boolean).map(Number),
        p=+$("p").value,ml=Math.floor(+$("ml").value),seed=+$("seed").value,
        dk=Math.floor(+$("dk").value),lo=+$("lo").value,hi=+$("hi").value;
  if(!ns.length||ns.some(n=>!Number.isInteger(n)||n<100||n>500000))return setMsg("n values must be integers between 100 and 500000.",1);
  if(!(p>0&&p<1))return setMsg("p must be between 0 and 1.",1);
  if(!(ml>=1&&ml<=32))return setMsg("MaxLevel must be 1 to 32.",1);
  if(!(dk>=1&&dk<=999))return setMsg("Demo keys must be 1 to 999.",1);
  if(lo>hi)return setMsg("Range lo must be ≤ hi.",1);
  const sorted=[...new Set(ns)].sort((a,b)=>a-b),rnd=mulberry(seed);
  $("run").disabled=true;let all=[];
  for(const N of sorted){
    setMsg(`Running n = ${N.toLocaleString()} ...`);
    await new Promise(r=>setTimeout(r,30));
    all=all.concat(benchmark(N,rnd,p,ml));
  }
  /* table */
  let t=`<tr><th>n</th><th>Op</th><th>SkipList ms</th><th>AVL ms</th><th>SL cmp/op</th><th>AVL cmp/op</th></tr>`;
  all.forEach((r,i)=>{t+=`<tr${r.op==="delete"?' class="sep"':""}><td>${r.N}</td><td>${r.op}</td><td>${r.ts.toFixed(1)}</td><td>${r.ta.toFixed(1)}</td><td>${r.sc.toFixed(1)}</td><td>${r.ac.toFixed(1)}</td></tr>`});
  $("tb").innerHTML=t;
  /* range query demo */
  const sl=new SkipList(rnd,ml,p),demo=pick(Array.from({length:999},(_,i)=>i+1),dk,rnd);
  demo.forEach(k=>sl.insert(k,k));
  const rq=sl.rangeQuery(lo,hi);
  $("extra").textContent=`Skip list levels used : ${sl.level+1}  (demo list of ${dk} keys)\nRange query [${lo},${hi}] : [${rq.join(", ")}]`;
  /* charts */
  const big=sorted[sorted.length-1];
  barChart(all.filter(r=>r.N===big),big);
  lineChart(all.filter(r=>r.op==="search"));
  /* analysis */
  const g=op=>all.find(r=>r.N===big&&r.op===op),i=g("insert"),s=g("search"),d=g("delete");
  const w=(a,b,x)=>a<b?`skip list (${a.toFixed(0)} ms vs ${b.toFixed(0)} ms)`:`AVL tree (${b.toFixed(0)} ms vs ${a.toFixed(0)} ms)`;
  $("an").innerHTML=`<p>At n = ${big.toLocaleString()}: insert is faster with the ${w(i.ts,i.ta)}, search with the ${w(s.ts,s.ta)}, delete with the ${w(d.ts,d.ta)}.</p>
  <p>Per search, the skip list used ${s.sc.toFixed(1)} comparisons (2·log₂ n = ${(2*Math.log2(big)).toFixed(1)}) and the AVL tree ${s.ac.toFixed(1)} (log₂ n = ${Math.log2(big).toFixed(1)}), so both grow logarithmically. The skip list needs about twice the comparisons (expected search cost log<sub>1/p</sub> n / p) but updates only local pointers, while the AVL tree pays for height updates and rotations on insert and delete. The skip list also answers range queries by a simple level-0 walk.</p>`;
  $("res").style.display="block";$("run").disabled=false;
  setMsg("Done. Timings vary by browser and machine.");
};
</script>
</body>
</html>
